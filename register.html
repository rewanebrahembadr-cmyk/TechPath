<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | TechPath</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>TechPath</h1>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/register">Start Quiz</a>
                <a href="/tracks">Explore Tracks</a>
                <a href="/admin">Admin</a>
            </div>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-card">
            <p class="tagline">Start Your Journey</p>

            <h2>Tell Us About Yourself</h2>

            <p class="form-description">
                Enter your information before starting the track discovery quiz.
            </p>

            <form action="/register" method="POST">

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="faculty">Faculty</label>
                    <input
                        type="text"
                        id="faculty"
                        name="faculty"
                        placeholder="Example: Business Administration"
                        required
                    >
                </div>

               <div class="form-group">
    <label for="study_year">Study Year</label>

    <select id="study_year" name="study_year" required>
               <option value="">Select your study year</option>
               <option value="Preparatory Year">Preparatory Year</option>
             <option value="First Year">First Year</option>
             <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
           <option value="Fourth Year">Fourth Year</option>
           <option value="Fifth Year">Fifth Year</option>
           <option value="Graduate">Graduate</option>
         </select>
        </div>

                <div class="form-group">
                    <label for="experience_level">Experience Level</label>
                    <select
                        id="experience_level"
                        name="experience_level"
                        required
                    >
                        <option value="">Select your experience level</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="initial_track_id">
                        Which track are you currently considering?
                    </label>

                    <select id="initial_track_id" name="initial_track_id">
                        <option value="">I am not sure yet</option>
                        <option value="1">AI & Automation</option>
                        <option value="2">Data Analysis</option>
                        <option value="3">Data Science</option>
                        <option value="4">Machine Learning</option>
                        <option value="5">Web Development</option>
                        <option value="6">UI/UX Design</option>
                        <option value="7">Cybersecurity</option>
                        <option value="8">Cloud & DevOps</option>
                    </select>
                </div>

                <button type="submit" class="primary-button form-button">
                    Continue to Quiz
                </button>

            </form>
        </section>
    </main>

</body>
</html>
